<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabAgent</title>
    <meta name="manifest.open_at_install" content="false" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="brand"><img src="/icon/32.png" alt="" /> TabAgent</div>
      <div class="actions">
        <button id="new-chat" title="新对话">新对话</button>
        <button id="open-options" title="设置">设置</button>
      </div>
    </header>
    <main id="log">
      <section id="empty">
        <h2>想让我在网页上做什么？</h2>
        <p>我会读取当前标签页，替你点击、填写、提取，也能把多个标签页的信息汇总到一起。</p>
        <div id="examples">
          <button>总结这个页面的要点</button>
          <button>把这个页面上的表格整理成 Markdown</button>
          <button>对比我打开的所有商品页面的价格和参数</button>
          <button>帮我把这个表单按以下信息填好：</button>
        </div>
      </section>
    </main>
    <footer>
      <textarea id="input" rows="3" placeholder="输入指令，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
