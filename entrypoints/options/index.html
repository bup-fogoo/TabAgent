<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TabAgent 设置</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="page-header"><img class="page-mark" src="/icon.svg" alt="" /><h1>设置</h1></header>
      <form id="form" novalidate aria-busy="true">
        <div class="settings-panel">
        <fieldset class="settings-card" id="provider-section" aria-labelledby="provider-heading" disabled>
          <h2 id="provider-heading">模型服务</h2>
          <div class="provider-options">
            <label class="provider-option" title="Anthropic 官方接口或兼容中转">
              <input type="radio" name="provider" value="anthropic" />
              <span>Claude</span><span class="radio-indicator" data-icon="check" aria-hidden="true"></span>
            </label>
            <label class="provider-option" title="OpenAI、DeepSeek、Ollama 等">
              <input type="radio" name="provider" value="openai" />
              <span>OpenAI 兼容</span><span class="radio-indicator" data-icon="check" aria-hidden="true"></span>
            </label>
          </div>
        </fieldset>
        <fieldset class="settings-card connection-card" id="connection-anthropic" data-provider="anthropic" aria-labelledby="anthropic-heading" disabled>
          <h2 id="anthropic-heading" class="sr-only">连接配置</h2>
          <div class="field-grid service-row">
            <div class="field"><label for="anthropic-service">服务来源</label><div class="select-field"><select id="anthropic-service" data-service="anthropic"><option value="official">官方</option><option value="aitransx">AITransX</option><option value="custom">自定义</option></select><span data-icon="chevron-down" aria-hidden="true"></span></div></div>
            <div class="field"><label for="anthropic-url">接口地址 <span class="field-note" id="anthropic-url-note">预设</span></label><input id="anthropic-url" name="anthropicBaseUrl" type="url" placeholder="https://api.anthropic.com" spellcheck="false" autocomplete="off" aria-describedby="anthropic-url-error" /><p class="field-error" id="anthropic-url-error" hidden></p></div>
          </div>
          <div class="field custom-panel" id="anthropic-custom-panel" hidden><label for="anthropic-custom-profile">连接档案</label><div class="custom-controls"><div class="select-field"><select id="anthropic-custom-profile" data-custom-provider="anthropic" aria-label="连接档案"></select><span data-icon="chevron-down" aria-hidden="true"></span></div><button type="button" id="anthropic-custom-add" title="新建连接" aria-label="新建连接"><span data-icon="plus" aria-hidden="true"></span></button><button type="button" id="anthropic-custom-rename" title="重命名连接" aria-label="重命名连接"><span data-icon="edit" aria-hidden="true"></span></button><button type="button" id="anthropic-custom-delete" title="删除连接" aria-label="删除连接"><span data-icon="trash" aria-hidden="true"></span></button></div></div>
          <div class="field">
            <label for="anthropic-key">API Key <span class="field-note" id="anthropic-key-note">必填</span></label>
            <div class="secret-input"><input id="anthropic-key" name="anthropicApiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" required aria-describedby="anthropic-key-error" /><button type="button" class="reveal-key" aria-controls="anthropic-key" aria-label="显示 Claude API Key" aria-pressed="false" title="显示密钥"><span data-icon="eye" aria-hidden="true"></span></button></div>
            <p class="field-error" id="anthropic-key-error" hidden></p>
          </div>
          <div class="field-grid">
            <div class="field"><label for="anthropic-model">模型</label><div class="model-input"><input id="anthropic-model" name="anthropicModel" required spellcheck="false" title="可选择或输入模型名" aria-describedby="anthropic-model-error" /><button type="button" id="anthropic-pick-model" aria-label="选择 Claude 模型" title="获取模型列表" aria-haspopup="dialog"><span data-icon="chevron-down" aria-hidden="true"></span></button></div><p class="field-error" id="anthropic-model-error" hidden></p>
            </div>
            <div class="field"><label for="effort">思考力度</label><div class="select-field"><select id="effort" name="effort" title="更高力度会增加耗时与用量"><option value="low">低 · 更快</option><option value="medium">中 · 均衡</option><option value="high">高 · 深入</option></select><span data-icon="chevron-down" aria-hidden="true"></span></div></div>
          </div>
          <div class="field vision-field"><label class="vision-toggle" for="anthropic-vision"><span class="vision-copy"><span>图片识别</span><small id="anthropic-vision-help">按需发送网页截图，需模型支持</small></span><input id="anthropic-vision" name="anthropicVision" type="checkbox" role="switch" aria-describedby="anthropic-vision-help" /></label></div>
        </fieldset>
        <fieldset class="settings-card connection-card" id="connection-openai" data-provider="openai" aria-labelledby="openai-heading" hidden disabled>
          <h2 id="openai-heading" class="sr-only">连接配置</h2>
          <div class="field-grid service-row">
            <div class="field"><label for="openai-service">服务来源</label><div class="select-field"><select id="openai-service" data-service="openai"><option value="official">官方</option><option value="aitransx">AITransX</option><option value="custom">自定义</option></select><span data-icon="chevron-down" aria-hidden="true"></span></div></div>
            <div class="field"><label for="openai-url">接口地址 <span class="field-note" id="openai-url-note">预设</span></label><input id="openai-url" name="openaiBaseUrl" type="url" required placeholder="https://api.openai.com/v1" spellcheck="false" autocomplete="off" aria-describedby="openai-url-error" /><p class="field-error" id="openai-url-error" hidden></p></div>
          </div>
          <div class="field custom-panel" id="openai-custom-panel" hidden><label for="openai-custom-profile">连接档案</label><div class="custom-controls"><div class="select-field"><select id="openai-custom-profile" data-custom-provider="openai" aria-label="连接档案"></select><span data-icon="chevron-down" aria-hidden="true"></span></div><button type="button" id="openai-custom-add" title="新建连接" aria-label="新建连接"><span data-icon="plus" aria-hidden="true"></span></button><button type="button" id="openai-custom-rename" title="重命名连接" aria-label="重命名连接"><span data-icon="edit" aria-hidden="true"></span></button><button type="button" id="openai-custom-delete" title="删除连接" aria-label="删除连接"><span data-icon="trash" aria-hidden="true"></span></button></div></div>
          <div class="field"><label for="openai-key">API Key <span class="field-note" id="openai-key-note">必填</span></label><div class="secret-input"><input id="openai-key" name="openaiApiKey" type="password" autocomplete="off" spellcheck="false" aria-describedby="openai-key-error" /><button type="button" class="reveal-key" aria-controls="openai-key" aria-label="显示 OpenAI 兼容接口 API Key" aria-pressed="false" title="显示密钥"><span data-icon="eye" aria-hidden="true"></span></button></div><p class="field-error" id="openai-key-error" hidden></p></div>
          <div class="field"><label for="openai-model">模型 <span class="field-note">必填</span></label><div class="model-input"><input id="openai-model" name="openaiModel" required placeholder="如 gpt-4o、deepseek-chat" spellcheck="false" aria-describedby="openai-model-help openai-model-error" /><button type="button" id="openai-pick-model" aria-label="选择模型" title="获取模型与供应商列表" aria-haspopup="dialog"><span data-icon="chevron-down" aria-hidden="true"></span></button></div><p class="field-hint" id="openai-model-help">需支持工具调用</p><p class="field-error" id="openai-model-error" hidden></p>
          </div>
          <div class="field vision-field"><label class="vision-toggle" for="openai-vision"><span class="vision-copy"><span>图片识别</span><small id="openai-vision-help">按需发送网页截图，需模型支持</small></span><input id="openai-vision" name="openaiVision" type="checkbox" role="switch" aria-describedby="openai-vision-help" /></label></div>
        </fieldset>
        <div class="connection-check">
          <div class="connection-actions"><button id="test-connection" type="button" disabled title="测试连接与工具调用，不测试图片识别；不会保存，可能产生少量用量"><span data-icon="arrow-right" aria-hidden="true"></span><span id="test-label">测试连接</span></button><button id="cancel-test" type="button" hidden>取消测试</button><span id="test-elapsed" aria-hidden="true"></span></div>
          <p id="connection-result" role="status" aria-live="polite" hidden></p>
        </div>
        <fieldset class="settings-card" id="task-section" aria-labelledby="max-steps-label" disabled>
          <div class="step-field field"><div><label id="max-steps-label" for="max-steps">单个任务最多步数</label><p class="field-hint" id="max-steps-help">5–200 步，默认 40</p></div><div class="step-input"><input id="max-steps" name="maxSteps" type="number" min="5" max="200" step="1" required inputmode="numeric" aria-describedby="max-steps-help max-steps-error" /><span aria-hidden="true">步</span></div><p class="field-error" id="max-steps-error" hidden></p></div>
        </fieldset>
        </div>
        <p class="privacy-note">密钥仅保存在本机</p>
        <footer class="save-bar"><div class="save-feedback"><span id="form-status" role="status" aria-live="polite">读取中…</span><span id="saved" role="status" hidden>已保存</span><span id="form-error" role="alert" hidden></span><button type="button" id="retry-load" hidden>重试</button></div><div class="save-actions"><button id="discard-changes" type="button" disabled title="恢复上次保存的设置"><span data-icon="rotate-ccw" aria-hidden="true"></span><span>撤销更改</span></button><button id="save-button" type="submit" disabled title="保存设置（Ctrl / ⌘ + S）"><span data-icon="save" aria-hidden="true"></span><span id="save-label">保存</span></button></div></footer>
      </form>
      <dialog id="connection-editor" aria-labelledby="connection-editor-title">
        <form id="connection-editor-form"><h2 id="connection-editor-title">新建连接</h2><p id="connection-editor-description"></p><div class="field" id="connection-name-field"><label for="connection-name">名称</label><input id="connection-name" maxlength="60" autocomplete="off" placeholder="如 工作接口、本地模型" /></div><p id="connection-editor-error" role="alert"></p><div class="connection-editor-actions"><button type="button" id="connection-editor-cancel">取消</button><button type="submit" id="connection-editor-confirm">确定</button></div></form>
      </dialog>
      <dialog id="model-picker" aria-labelledby="model-picker-title">
        <header class="model-picker-header"><h2 id="model-picker-title">选择模型</h2><button id="model-close" type="button" class="model-icon-button" aria-label="关闭模型选择"><span data-icon="close" aria-hidden="true"></span></button></header>
        <div class="model-tabs" aria-label="模型范围"><button type="button" data-model-filter="all" aria-pressed="true">全部</button><button type="button" data-model-filter="favorites" aria-pressed="false">收藏</button><button type="button" data-model-filter="recent" aria-pressed="false">最近使用</button></div>
        <div class="model-search-row"><input id="model-search" type="search" placeholder="搜索模型或供应商" aria-label="搜索模型或供应商" autocomplete="off" /><div class="select-field"><select id="model-vendor" aria-label="筛选模型来源"><option value="">全部来源</option></select><span data-icon="chevron-down" aria-hidden="true"></span></div><button id="model-refresh" type="button" class="model-icon-button" aria-label="刷新模型列表" title="刷新列表"><span data-icon="rotate-ccw" aria-hidden="true"></span></button></div>
        <div class="model-list-status"><p id="model-status" role="status" aria-live="polite"></p><span id="model-count"></span></div>
        <div id="model-list" aria-label="模型列表" aria-busy="false"></div>
        <footer class="model-picker-footer"><div id="model-supplier-field" class="field"><label for="model-supplier">供应商</label><div class="select-field"><select id="model-supplier"></select><span data-icon="chevron-down" aria-hidden="true"></span></div></div><button id="model-favorite" type="button" class="model-icon-button" title="收藏当前模型" aria-label="收藏当前模型" aria-pressed="false" disabled><span data-icon="star" aria-hidden="true"></span></button><button id="model-apply" type="button" disabled>使用此模型</button></footer>
      </dialog>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
