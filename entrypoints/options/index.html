<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabAgent 设置</title>
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <form id="form">
      <h1>TabAgent 设置</h1>
      <p class="hint">API Key 只保存在本机浏览器的插件存储中，插件直接从你的浏览器调用模型服务，不经过任何第三方服务器。</p>

      <fieldset>
        <legend>模型服务</legend>
        <label class="radio"><input type="radio" name="provider" value="anthropic" /> Claude（Anthropic，推荐）</label>
        <label class="radio"><input type="radio" name="provider" value="openai" /> OpenAI 兼容接口（OpenAI、DeepSeek、通义千问、Kimi、智谱、OpenRouter、Ollama 等）</label>
      </fieldset>

      <fieldset data-provider="anthropic">
        <legend>Claude</legend>
        <label>API Key <input name="anthropicApiKey" type="password" autocomplete="off" placeholder="sk-ant-..." /></label>
        <label>模型
          <input name="anthropicModel" list="anthropic-models" />
          <datalist id="anthropic-models">
            <option value="claude-opus-5-5">Claude Opus 5.5（默认，能力强）</option>
            <option value="claude-sonnet-5-5">Claude Sonnet 5.5（更快更便宜）</option>
            <option value="claude-haiku-5-5">Claude Haiku 5.5（最快最便宜）</option>
            <option value="claude-fable-5-1">Claude Fable 5.1（最强，最贵）</option>
          </datalist>
        </label>
        <label>接口地址（可选，用于代理/中转）<input name="anthropicBaseUrl" placeholder="留空使用 https://api.anthropic.com" /></label>
        <label>思考力度
          <select name="effort">
            <option value="low">低：最快、最省</option>
            <option value="medium">中：默认</option>
            <option value="high">高：复杂任务更稳</option>
          </select>
        </label>
      </fieldset>

      <fieldset data-provider="openai">
        <legend>OpenAI 兼容接口</legend>
        <label>接口地址 <input name="openaiBaseUrl" placeholder="https://api.openai.com/v1" /></label>
        <label>API Key <input name="openaiApiKey" type="password" autocomplete="off" placeholder="本地 Ollama 可留空" /></label>
        <label>模型 <input name="openaiModel" placeholder="如 gpt-4o、deepseek-chat、qwen-plus" /></label>
        <p class="hint">模型需要支持工具调用（function calling）。</p>
      </fieldset>

      <fieldset>
        <legend>任务</legend>
        <label>单个任务最多步数 <input name="maxSteps" type="number" min="5" max="200" /></label>
      </fieldset>

      <div class="row">
        <button type="submit">保存</button>
        <span id="saved" hidden>已保存</span>
      </div>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
